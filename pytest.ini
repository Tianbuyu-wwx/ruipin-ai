[pytest]
# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加项目路径
pythonpath = .

# 测试报告
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 标记定义
markers =
    slow: 运行缓慢的测试
    integration: 集成测试
    unit: 单元测试
    model: 需要模型的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率报告（需要安装pytest-cov）
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# 忽略目录
norecursedirs = 
    .git
    .tox
    .eggs
    __pycache__
    build
    dist
    *.egg
    base_model
    models
